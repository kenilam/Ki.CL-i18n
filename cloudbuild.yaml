steps:
  - id: Build
    name: gcr.io/cloud-builders/docker
    args: ['build', '--no-cache', '-t', '$_IMAGE', '.']

  - id: Check
    name: $_IMAGE
    entrypoint: bash
    args: ['-c', 'cd /src && node_modules/.bin/tsx --tsconfig Server/tsconfig.json Server/Scripts/registry.ts check $_REGISTRY_BUCKET']

  - id: Push
    name: gcr.io/cloud-builders/docker
    args: ['push', '$_IMAGE']

  # Only the gateway, the builds, Cloud Scheduler and the host may reach the service.
  - id: Private
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        if gcloud run services get-iam-policy $_SERVICE_NAME --region=$_DEPLOY_REGION --format='value(bindings.members)' | grep -qE 'allUsers|allAuthenticatedUsers'; then
          echo "$_SERVICE_NAME lets anyone invoke it. Remove allUsers and allAuthenticatedUsers before deploying."
          exit 1
        fi

  # Sends this repo's English to Ki.CL-i18n before the code that reads it goes live. Dev translates
  # what's new at once and production copies dev's translations; a failure is left to the nightly run.
  - id: Words
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    allowFailure: true
    args:
      - -c
      - |
        set -eo pipefail
        python3 -c "import glob, json, os; print(json.dumps({os.path.basename(f)[:-5]: json.load(open(f)) for f in sorted(glob.glob('$_LOCALES/en-US/*.json'))}))" > /workspace/english.json
        url=$$(gcloud storage cat gs://$_REGISTRY_BUCKET/services/i18n.json | python3 -c "import json, sys; print(json.load(sys.stdin)['url'].removesuffix('/api'))")
        token=$$(gcloud auth print-identity-token --audiences=ki-cl-subgraphs)
        curl -sS --fail-with-body --max-time 600 -X POST "$$url/internal/english" -H "X-Serverless-Authorization: Bearer $$token" -H 'Content-Type: application/json' --data-binary @/workspace/english.json

  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run services update $_SERVICE_NAME \
          --image=$_IMAGE \
          --region=$_DEPLOY_REGION \
          --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID \
          --quiet
        gcloud run services describe $_SERVICE_NAME --region=$_DEPLOY_REGION --format='value(status.url)' > /workspace/url

  - id: Publish
    name: $_IMAGE
    entrypoint: bash
    args: ['-c', 'cd /src && node_modules/.bin/tsx --tsconfig Server/tsconfig.json Server/Scripts/registry.ts publish $_REGISTRY_BUCKET "$(cat /workspace/url)/api"']

substitutions:
  _AR_HOSTNAME: us-central1-docker.pkg.dev
  _AR_REPOSITORY: cloud-run-source-deploy
  _DEPLOY_REGION: us-central1
  _SERVICE_NAME: ki-cl-i18n-dev
  _REGISTRY_BUCKET: ki-cl-registry-dev
  _LOCALES: Client/src/locales
  _IMAGE: ${_AR_HOSTNAME}/${PROJECT_ID}/${_AR_REPOSITORY}/ki.cl-i18n/${_SERVICE_NAME}:${COMMIT_SHA}

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY

images:
  - $_IMAGE
