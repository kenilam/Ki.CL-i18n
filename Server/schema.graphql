directive @public on FIELD_DEFINITION

"""One string of the site's writing, in one language."""
type I18nTranslation {
  """`<accept-language>:<namespace>:<field>`."""
  id: ID!
  namespace: String!
  """The string's path in its namespace, joined with dots: `account.signOut`."""
  field: String!
  value: String!
}

"""Whether a language can be shown yet."""
type I18nAcceptLanguageStatus {
  """The language's BCP 47 tag."""
  id: ID!
  acceptLanguage: String!
  """Every `en-US` string is in this language. Only a complete language can be picked or answered in."""
  complete: Boolean!
  """A translate run is working on this language now."""
  translating: Boolean!
}

type Query {
  """
  Every string of the namespaces asked for. Each comes from the first language
  that has it: the request's Accept-Language header in its q order, matched
  among the complete languages, then `en-US`. The response names the languages
  in Content-Language.

  Runs without a session: the site needs its words before it can start one,
  and they are public.
  """
  i18nTranslations(namespaces: [String!]!): [I18nTranslation!]! @public
}

type Subscription {
  """Every language's status now, and again whenever one changes."""
  i18nAcceptLanguagesUpdated: [I18nAcceptLanguageStatus!]!
}
